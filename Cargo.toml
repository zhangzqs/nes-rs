[workspace]
resolver = "2"

members = [
    "nes-base",
    "nes-apu",
    "nes-cpu",
    "nes-ram",
    "nes-bus",
    "nes-board",
    "nes-cartridge",
    "nes-test",
    "nes-ppu", "nes-emulator", "nes-wasm",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
debug = true
opt-level = 1
