[package]
name = "nes-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nes-board = { path = "../nes-board" }
nes-cartridge = { path = "../nes-cartridge" }
wasm-bindgen = "0.2.129"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory"]
