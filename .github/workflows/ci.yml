name: NES regression checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release -p nes-emulator --locked
      - run: python3 scripts/check_test_roms.py /tmp/nes-test-roms --fetch --report /tmp/test-rom-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-rom-results
          path: /tmp/test-rom-results.json
