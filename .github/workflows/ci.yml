name: NES regression checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p nes-emulator --locked audio::tests -- --ignored
        env:
          SDL_AUDIODRIVER: dummy
      - run: cargo build --release -p nes-emulator --locked
      - run: python3 scripts/fetch_test_roms.py /tmp/nes-test-roms
      - run: cargo test --release -p nes-test --test hardware_roms --locked -- --ignored --nocapture | tee /tmp/test-rom-results.txt
        shell: bash
        timeout-minutes: 10
        env:
          NES_TEST_ROM_DIR: /tmp/nes-test-roms
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-rom-results
          path: /tmp/test-rom-results.txt
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - run: pnpm web:build
      - run: pnpm web:test
      - uses: actions/upload-artifact@v7
        with:
          name: browser-emulator
          path: |
            nes-web/*.html
            nes-web/*.css
            nes-web/*.js
            nes-web/pkg/*.js
            nes-web/pkg/*.wasm
